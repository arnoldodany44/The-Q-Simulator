packages:
  - 'apps/*'
  - 'packages/*'

# Single source of truth for dependency versions across the monorepo.
# Packages reference these with "catalog:" instead of a literal version,
# so an upgrade happens in one place and can never drift between workspaces.
catalog:
  # Language and build
  typescript: 6.0.3
  vite: 8.2.1
  '@vitejs/plugin-react': 6.0.5

  # Runtime — web
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4

  # Typography (§10: Space Grotesk / Inter / IBM Plex Mono). Self-hosted with
  # @fontsource rather than a Google Fonts <link>, for two reasons that are
  # both requirements rather than preferences: `pnpm dev` has to work on a
  # plane, and a deployed page must not hand a third-party origin a request
  # per visitor. Self-hosting also means the font files are subject to the
  # same immutable-hash caching as the rest of the bundle.
  #
  # Inter and Space Grotesk ship as variable fonts, so one file covers every
  # weight the design uses. IBM Plex Mono has no variable build on fontsource,
  # so it is pulled in as static weights — deliberately only the two the data
  # tables need.
  '@fontsource-variable/inter': 5.3.0
  '@fontsource-variable/space-grotesk': 5.3.0
  '@fontsource/ibm-plex-mono': 5.3.0

  # i18n (D2 — es/en/fr from day one)
  i18next: 26.3.6
  react-i18next: 17.0.11
  i18next-browser-languagedetector: 8.2.1

  # Validation
  zod: 4.4.3

  # Circuit sharing (D4: JSON → deflate → base64url in `?c=`).
  #
  # fflate rather than the platform's `CompressionStream`, and the reason is
  # not availability — it is that `CompressionStream` is a stream, so every
  # `encode`/`decode` would be async. A URL is read once, synchronously,
  # before the first render; an async decode means the editor mounts on a
  # blank document and then swaps it, which is a visible flash and an extra
  # history entry. fflate is synchronous, has zero dependencies of its own,
  # and produces byte-identical output in a browser and in Node — so the
  # share links a Phase 1 server would mint are the same strings the client
  # mints today. See `apps/web/src/lib/circuit-url.ts` for the full argument.
  fflate: 0.8.3

  # Editor state (§9: Zustand for circuit state, history middleware for undo/redo)
  zustand: 5.0.15
  zundo: 2.3.0

  # Editor interaction (§9: dnd-kit for drag and drop, chosen over the
  # alternatives for its keyboard sensor — the editor has to be usable with
  # no pointer at all, and that is not something a mouse-only library can be
  # retrofitted with). `utilities` carries the CSS transform helper the drag
  # overlay needs; `sortable` is deliberately absent until qubit reordering
  # actually needs it.
  '@dnd-kit/core': 6.3.1
  '@dnd-kit/utilities': 3.2.2

  # Routing (§9: React Router in declarative mode)
  react-router: 8.3.0

  # Testing
  vitest: 4.1.10
  '@vitest/coverage-v8': 4.1.10
  fast-check: 4.9.0
  jsdom: 30.0.1
  # Component tests query by role and accessible name, which is the only way
  # to test the canvas: its SVG is aria-hidden and its accessible surface is
  # a parallel table (see CircuitCanvas.tsx).
  '@testing-library/react': 16.3.2
  '@testing-library/dom': 10.4.1
  # End-to-end (M0.5). Playwright rather than Cypress for the two things this
  # suite actually needs: real `pointerdown`/`pointermove` streams, which is
  # the only way a dnd-kit drag can be exercised at all, and an accessibility
  # tree the assertions can read — the canvas is asserted through its ARIA
  # grid, not through the store.
  '@playwright/test': 1.62.1

  # Linting and formatting
  eslint: 10.8.1
  '@eslint/js': 10.0.1
  typescript-eslint: 8.67.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-i18next: 6.1.5
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.4
  globals: 17.11.0
  prettier: 3.9.6

  # Tooling
  turbo: 2.10.10
  dependency-cruiser: 18.2.0
  '@types/node': 26.2.0

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.10'
  - '@turbo/darwin-arm64@2.10.10'
  - '@turbo/linux-64@2.10.10'
  - '@turbo/linux-arm64@2.10.10'
  - '@turbo/windows-64@2.10.10'
  - '@turbo/windows-arm64@2.10.10'
  - turbo@2.10.10
