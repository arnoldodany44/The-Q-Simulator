packages:
  - 'apps/*'
  - 'packages/*'

# Postinstall scripts are denied by default. These two are allowed because
# `prisma migrate` cannot work without them: @prisma/engines downloads the
# schema engine binary that diffs the datamodel against the database, and the
# prisma CLI's own postinstall resolves that binary for the host platform.
# The query engine is gone in Prisma 7 — the generated client is TypeScript —
# so this is the migration toolchain only, not anything the API runs.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  # esbuild ships its compiler as a platform-specific binary in an optional
  # dependency, and its postinstall is what resolves the right one for this
  # host. It is a build-time tool for `apps/api` only — see that package's
  # `build.js` for why the API is bundled rather than emitted file by file.
  esbuild: true

# Single source of truth for dependency versions across the monorepo.
# Packages reference these with "catalog:" instead of a literal version,
# so an upgrade happens in one place and can never drift between workspaces.
catalog:
  # Language and build
  typescript: 6.0.3
  vite: 8.2.1
  '@vitejs/plugin-react': 6.0.5

  # Runtime — web
  react: 19.2.8
  react-dom: 19.2.8
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4

  # Typography (§10: Space Grotesk / Inter / IBM Plex Mono). Self-hosted with
  # @fontsource rather than a Google Fonts <link>, for two reasons that are
  # both requirements rather than preferences: `pnpm dev` has to work on a
  # plane, and a deployed page must not hand a third-party origin a request
  # per visitor. Self-hosting also means the font files are subject to the
  # same immutable-hash caching as the rest of the bundle.
  #
  # Inter and Space Grotesk ship as variable fonts, so one file covers every
  # weight the design uses. IBM Plex Mono has no variable build on fontsource,
  # so it is pulled in as static weights — deliberately only the two the data
  # tables need.
  '@fontsource-variable/inter': 5.3.0
  '@fontsource-variable/space-grotesk': 5.3.0
  '@fontsource/ibm-plex-mono': 5.3.0

  # i18n (D2 — es/en/fr from day one)
  i18next: 26.3.6
  react-i18next: 17.0.11
  i18next-browser-languagedetector: 8.2.1

  # Validation
  zod: 4.4.3

  # Runtime — API (§12.4: Fastify on Railway). The `@fastify/*` plugins are
  # versioned independently of the core, and each major of a plugin targets one
  # major of Fastify: `cors@11` and `rate-limit@11` are the Fastify 5 lines.
  # `fastify-plugin` is what stops a plugin from being encapsulated — without
  # it, a decorator or hook registered inside a plugin is invisible to the app
  # that registered it, which is the single most common Fastify surprise.
  fastify: 5.12.0
  '@fastify/cors': 11.3.0
  '@fastify/rate-limit': 11.2.0
  fastify-plugin: 6.0.0
  # Token verification. `jose` rather than `jsonwebtoken`: it verifies with the
  # platform WebCrypto (no native build on Railway), it supports ES256 on P-256
  # which is what Supabase's asymmetric signing keys use, and it refuses to
  # verify with an algorithm the caller did not ask for — which is the defence
  # against the `alg` confusion attack that has bitten every other library.
  jose: 6.2.9
  # Fastify bundles pino already; naming it here pins the version the API's
  # logging configuration is written against (`^9.14.0 || ^10.1.0` is what
  # Fastify 5.12 accepts) and gives the redaction config real types.
  pino: 10.3.1

  # Persistence (§12.6). Prisma 7 dropped the Rust query engine: the client is
  # generated TypeScript and talks to Postgres through a driver adapter, which
  # is why `@prisma/adapter-pg` is a runtime dependency and not an add-on. The
  # three packages are released in lockstep and must stay on the same version.
  prisma: 7.9.1
  '@prisma/client': 7.9.1
  '@prisma/adapter-pg': 7.9.1

  # Public handles for circuits (§11: "slug generado por `nanoid` de
  # suficiente entropía"). Zero dependencies, and its generator draws from
  # `crypto.getRandomValues` with a bitmask rather than a modulo, so a
  # 64-symbol alphabet is sampled without bias — which is the whole reason to
  # take a library for eleven lines of code. `packages/db` owns the only
  # import; a slug is minted where the row is written and nowhere else.
  nanoid: 6.0.1

  # Circuit sharing (D4: JSON → deflate → base64url in `?c=`).
  #
  # fflate rather than the platform's `CompressionStream`, and the reason is
  # not availability — it is that `CompressionStream` is a stream, so every
  # `encode`/`decode` would be async. A URL is read once, synchronously,
  # before the first render; an async decode means the editor mounts on a
  # blank document and then swaps it, which is a visible flash and an extra
  # history entry. fflate is synchronous, has zero dependencies of its own,
  # and produces byte-identical output in a browser and in Node — so the
  # share links a Phase 1 server would mint are the same strings the client
  # mints today. See `apps/web/src/lib/circuit-url.ts` for the full argument.
  fflate: 0.8.3

  # Editor state (§9: Zustand for circuit state, history middleware for undo/redo)
  zustand: 5.0.15
  zundo: 2.3.0

  # Server state (§9: "Zustand for circuit state … React Query for everything
  # that comes from the server. Do not mix the two.")
  #
  # The two halves of that sentence are not the same problem, which is the
  # whole argument for a second library rather than a slice of the store. The
  # circuit being edited is owned by this tab: it is synchronous, it has an
  # undo stack, and it is nobody else's. Anything from the API is a *cache* of
  # state that lives elsewhere — it can be stale, it can be refetched, two
  # components can want it at once, and the request can fail or be superseded.
  # Modelling the second as if it were the first is how a codebase grows a
  # hand-written `isLoading` flag per screen and an invalidation bug per
  # feature.
  #
  # Deliberately without `@tanstack/react-query-devtools`: it is a second
  # bundle to keep pinned, and the same information is one `queryClient
  # .getQueryCache()` away in a console.
  '@tanstack/react-query': 5.101.4

  # Authentication (§11: "delegated to Supabase Auth"). The browser client
  # only — `@supabase/supabase-js` is what holds the session, refreshes the
  # access token before it expires, and persists it across a reload. The API
  # never sees this package: it verifies the resulting JWT against the
  # project's JWKS with `jose` and shares no code with the client that minted
  # it, which is the point of delegating.
  #
  # It is a dependency of `apps/web` alone. Nothing on the server may import
  # it, because everything it offers server-side needs the secret key, and a
  # package that can do both is one import away from putting that key in a
  # bundle.
  '@supabase/supabase-js': 2.112.3

  # Editor interaction (§9: dnd-kit for drag and drop, chosen over the
  # alternatives for its keyboard sensor — the editor has to be usable with
  # no pointer at all, and that is not something a mouse-only library can be
  # retrofitted with). `utilities` carries the CSS transform helper the drag
  # overlay needs; `sortable` is deliberately absent until qubit reordering
  # actually needs it.
  '@dnd-kit/core': 6.3.1
  '@dnd-kit/utilities': 3.2.2

  # Routing (§9: React Router in declarative mode)
  react-router: 8.3.0

  # 3D (§9: "three.js only for the Bloch spheres and the Q-sphere, loaded with
  # `lazy()` so the initial bundle does not pay for it"). M1.6 is the first
  # user: one WebGL canvas for the whole grid of spheres.
  #
  # It has zero runtime dependencies of its own, which is what makes the split
  # chunk a clean one — the editor's chunk grows by nothing and the sphere
  # chunk carries exactly this. It ships no type declarations either (no
  # `types` field, no `.d.ts` beside `build/three.module.js`), so `@types/three`
  # is a requirement rather than a convenience; DefinitelyTyped versions it in
  # step with the library, which is why the two numbers below track each other
  # and must be bumped together.
  three: 0.185.1
  '@types/three': 0.185.4

  # Testing
  vitest: 4.1.10
  '@vitest/coverage-v8': 4.1.10
  fast-check: 4.9.0
  jsdom: 30.0.1
  # Component tests query by role and accessible name, which is the only way
  # to test the canvas: its SVG is aria-hidden and its accessible surface is
  # a parallel table (see CircuitCanvas.tsx).
  '@testing-library/react': 16.3.2
  '@testing-library/dom': 10.4.1
  # End-to-end (M0.5). Playwright rather than Cypress for the two things this
  # suite actually needs: real `pointerdown`/`pointermove` streams, which is
  # the only way a dnd-kit drag can be exercised at all, and an accessibility
  # tree the assertions can read — the canvas is asserted through its ARIA
  # grid, not through the store.
  '@playwright/test': 1.62.1

  # Linting and formatting
  eslint: 10.8.1
  '@eslint/js': 10.0.1
  typescript-eslint: 8.67.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-i18next: 6.1.5
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-react-refresh: 0.5.4
  globals: 17.11.0
  prettier: 3.9.6

  # Tooling
  # esbuild builds `apps/api` into a single runnable file. It is not a
  # bundler-by-preference: the workspace packages are published as TypeScript
  # source, and Node cannot load them (see apps/api/build.js).
  esbuild: 0.28.2
  turbo: 2.10.10
  dependency-cruiser: 18.2.0
  '@types/node': 26.2.0

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.10'
  - '@turbo/darwin-arm64@2.10.10'
  - '@turbo/linux-64@2.10.10'
  - '@turbo/linux-arm64@2.10.10'
  - '@turbo/windows-64@2.10.10'
  - '@turbo/windows-arm64@2.10.10'
  - turbo@2.10.10
  - jose@6.2.9
