<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Q Simulator</title>
    <!--
      Both attributes below are pre-boot values, not the shipped copy. `lang`
      and this description are rewritten from the active catalog in
      `src/i18n/index.ts` before the first render, and again on every language

      preview are what it is for. English is the right thing to serve here: it
      is `FALLBACK_LANGUAGE`, and the string is the `common:meta.description`
      of the `en` catalog, kept in step with it.
    -->
    <meta
      name="description"
      content="Build quantum circuits in your browser, watch the state evolve, and run them on real hardware."
    />
