[package]
name = "qsim-kernel"
version = "0.1.0"
edition = "2021"
description = "The statevector numeric core of The Q Simulator, compiled to WebAssembly"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# `cdylib` is what wasm-pack links. `rlib` is what `cargo test` needs: the
# kernel module is plain Rust over `&mut [f64]` with no WebAssembly in it, so
# the arithmetic can be tested on the host — natively, in seconds, with a
# debugger — before it is ever compiled to wasm32. The equivalence suite in
# TypeScript is the authority on whether it matches the engine; these are the
# unit tests that stop obvious index arithmetic from reaching that far.

[dependencies]
wasm-bindgen = "0.2"

[features]
default = []
# Enables the 128-bit SIMD paths. Off by default because `simd128` is a
# compile target feature, not a runtime branch: a module built with it will
# not instantiate at all on an engine that lacks the proposal. CI therefore
# builds two artifacts and the loader picks between them — see `detect.ts`.
simd = []

[profile.release]
# The kernel is 2ⁿ tight loops. Optimise for speed, not for artifact size:
# the whole module is a few tens of kilobytes either way, and it is fetched
# once against a simulation that runs for as long as the user keeps editing.
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
